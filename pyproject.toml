[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uaap-lead-nurturing"
version = "0.1.0"
description = "Lead Nurturing: Flags marketing leads needing follow-up; drafts one for approval. Platform workspace only."
requires-python = ">=3.11"
dependencies = [
  "uaap @ git+https://github.com/qavril-labs/uaap.git@main",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.entry-points."uaap.bots"]
"lead-nurturing" = "uaap_bot_lead_nurturing:SPEC"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:langsmith"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
